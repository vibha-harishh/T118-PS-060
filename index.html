    <script>
      // Ignore WebSocket errors in AI Studio iframe where HMR is disabled
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (
          (e.reason.message && e.reason.message.includes('WebSocket')) ||
          (e.reason.stack && e.reason.stack.includes('@vite/client'))
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
